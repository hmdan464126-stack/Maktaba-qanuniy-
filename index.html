<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10243a">
<meta name="description" content="المكتبة القانونية - إدارة الموكلين والقضايا والجلسات والمذكرات والمستندات والحسابات">
<link rel="manifest" href="manifest.webmanifest">
<title>المكتبة القانونية</title>
<style>
:root{--navy:#10243a;--navy2:#193752;--gold:#c6a45b;--bg:#f3f5f8;--ink:#172536;--muted:#6b7785;--line:#e2e7ed;--red:#b63c3c;--green:#26734d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;padding:20px 16px;border-bottom:4px solid var(--gold)}
.top{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border:1px solid #d8bd7b;border-radius:14px;display:grid;place-items:center;font-size:25px;color:#e5ca87}.brand h1{font-size:20px;margin:0 0 5px}.brand p{margin:0;color:#d5deea;font-size:12px}
main{max-width:1150px;margin:20px auto;padding:0 14px 80px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 12px #14283a0a}.stat{padding:13px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:7px;color:var(--navy)}
.tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 13px}.tab{border:1px solid var(--line);background:white;color:var(--navy);padding:10px 13px;border-radius:10px;white-space:nowrap;font-weight:bold}.tab.active{background:var(--navy);color:white;border-color:var(--navy)}
.panel{padding:15px;margin-bottom:14px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.panel h2{font-size:17px;margin:0;color:var(--navy)}.hint{font-size:12px;color:var(--muted);line-height:1.7}
button{cursor:pointer;font-family:inherit}.primary{background:var(--gold);color:#1c2632;border:0;border-radius:9px;padding:10px 14px;font-weight:bold}.secondary{background:#edf1f5;color:var(--navy);border:1px solid var(--line);border-radius:9px;padding:9px 12px}.danger{color:var(--red);background:#fff0f0;border:1px solid #f1d0d0;border-radius:8px;padding:7px 10px}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}label{display:block;font-size:13px;font-weight:bold;color:#39495a}input,select,textarea{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #d7dee6;border-radius:9px;background:#fff;font:14px Tahoma,Arial;color:var(--ink);outline-color:var(--gold)}textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:11px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item h3{font-size:15px;margin:0 0 6px;color:var(--navy)}.item p{font-size:12px;color:var(--muted);margin:4px 0;line-height:1.7}.badge{display:inline-block;background:#f5f0e3;color:#755b23;padding:4px 8px;border-radius:20px;font-size:11px}.empty{text-align:center;padding:25px;color:var(--muted);border:1px dashed #ccd5df;border-radius:10px}.search{max-width:280px}.notice{background:#fff8e8;border:1px solid #ead9ad;padding:11px;border-radius:10px;color:#665222;font-size:12px;line-height:1.8}.money-in{color:var(--green);font-weight:bold}.money-out{color:var(--red);font-weight:bold}
.bottomnote{text-align:center;color:#8b96a3;font-size:11px;margin-top:22px}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:10px}.stat strong{font-size:21px}form{grid-template-columns:1fr}.full{grid-column:auto}.panelhead{align-items:flex-start;flex-direction:column}.item{flex-direction:column}.search{max-width:none;width:100%}}
@media print{header,.tabs,.no-print,button{display:none!important}body{background:white}.panel,.stat,.item{box-shadow:none;break-inside:avoid}main{max-width:none;margin:0;padding:0}.panel{border:0}}
</style></head>
<body>
<header><div class="top"><div class="brand"><div class="logo">⚖</div><div><h1>المكتبة القانونية</h1><p>نظام إدارة المكتب والموكلين والقضايا والمستندات</p></div></div><span style="font-size:12px;color:#e6d4a6">الإصدار 2.0</span></div></header>
<main>
<section class="stats">
<div class="stat"><small>إجمالي الموكلين</small><strong id="clientCount">0</strong></div>
<div class="stat"><small>القضايا المسجلة</small><strong id="caseCount">0</strong></div>
<div class="stat"><small>الجلسات القادمة</small><strong id="hearingCount">0</strong></div>
<div class="stat"><small>صافي الحسابات</small><strong id="balanceCount">0</strong></div>
</section>
<nav class="tabs no-print">
<button class="tab active" data-view="home">الرئيسية</button>
<button class="tab" data-view="clients">الموكلون</button>
<button class="tab" data-view="cases">القضايا</button>
<button class="tab" data-view="hearings">الجلسات</button>
<button class="tab" data-view="documents">المستندات</button>
<button class="tab" data-view="drafts">المذكرات القانونية</button>
<button class="tab" data-view="finance">الأتعاب والمصروفات</button>
<button class="tab" data-view="backup">النسخ الاحتياطي</button>
</nav>
<div id="view"></div>
<p class="bottomnote">تُحفظ البيانات محلياً في هذا المتصفح. أنشئ نسخة احتياطية دورية ولا تعتمد على جهاز واحد.</p>
</main>
<script>
const KEY='maktaba_qanuniya_v1';
function fresh(){return {clients:[],cases:[],hearings:[],documents:[],drafts:[],transactions:[]}}
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(!d||typeof d!=='object')return fresh();for(let k of ['clients','cases','hearings','documents','drafts','transactions'])if(!Array.isArray(d[k]))d[k]=[];return d}catch(e){return fresh()}}
let db=load(),view='home',editClient=null,editCase=null,editDraft=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderStats()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return Number(n||0).toLocaleString('en-US')}
function dateToday(){return new Date().toISOString().slice(0,10)}
function findClient(x){return db.clients.find(c=>c.id===x)}
function findCase(x){return db.cases.find(c=>c.id===x)}
function clientName(x){return findClient(x)?.name||'موكل غير محدد'}
function caseName(x){return findCase(x)?.title||'قضية غير محددة'}
function renderStats(){if(!$('clientCount'))return;$('clientCount').textContent=db.clients.length;$('caseCount').textContent=db.cases.length;$('hearingCount').textContent=db.hearings.filter(h=>h.date>=dateToday()).length;let total=db.transactions.reduce((s,t)=>s+(t.type==='قبض'?Number(t.amount): -Number(t.amount)),0);$('balanceCount').textContent=money(total)}
function setView(v){view=v;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
function render(){renderStats();let r=$('view');let pages={home,clients:clientsPage,cases:casesPage,hearings:hearingsPage,documents:documentsPage,drafts:draftsPage,finance:financePage,backup:backupPage};r.innerHTML=pages[view]();bind()}
function home(){let next=db.hearings.filter(h=>h.date>=dateToday()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);let drafts=db.drafts.length,docs=db.documents.length;return `<section class="panel"><div class="panelhead"><h2>لوحة إدارة المكتب القانوني</h2><span class="badge">الإصدار المطور 2.0</span></div><p class="hint">تمت إضافة سجل المستندات والمذكرات القانونية والحسابات، مع الإبقاء على سجلات الموكلين والقضايا والجلسات السابقة.</p><div class="actions no-print"><button class="primary" onclick="setView('clients')">إضافة موكل</button><button class="secondary" onclick="setView('cases')">تسجيل قضية</button><button class="secondary" onclick="setView('drafts')">إنشاء مذكرة</button><button class="secondary" onclick="setView('finance')">تسجيل حركة مالية</button></div></section><section class="stats"><div class="stat"><small>المستندات</small><strong>${docs}</strong></div><div class="stat"><small>المذكرات المحفوظة</small><strong>${drafts}</strong></div><div class="stat"><small>الحركات المالية</small><strong>${db.transactions.length}</strong></div><div class="stat"><small>القضايا النشطة</small><strong>${db.cases.filter(c=>c.status!=='منتهية'&&c.status!=='مؤرشفة').length}</strong></div></section><section class="panel"><div class="panelhead"><h2>أقرب الجلسات</h2><button class="secondary no-print" onclick="setView('hearings')">عرض الجلسات</button></div>${next.length?`<div class="list">${next.map(h=>`<div class="item"><div><h3>${esc(h.title)}</h3><p>${esc(caseName(h.caseId))} · ${esc(h.court||'')}</p><p>التاريخ: ${esc(h.date)} · الوقت: ${esc(h.time||'غير محدد')}</p></div></div>`).join('')}</div>`:'<div class="empty">لا توجد جلسات قادمة مسجلة.</div>'}</section><div class="notice">تنبيه مهم: النسخة الحالية لا توفر تشفيراً متخصصاً أو مزامنة سحابية. لا تحفظ فيها أسرار الموكلين أو صور هوياتهم الحساسة قبل اعتماد حل آمن ومشفّر، واحتفظ بنسخة احتياطية في مكان مأمون.</div>`}
function clientsPage(){let c=findClient(editClient);return `<section class="panel"><div class="panelhead"><h2>${c?'تعديل بيانات موكل':'إضافة موكل جديد'}</h2></div><form id="clientForm"><label>اسم الموكل<input name="name" required value="${esc(c?.name||'')}"></label><label>رقم الهاتف<input name="phone" value="${esc(c?.phone||'')}" inputmode="tel"></label><label>رقم الهوية<input name="identity" value="${esc(c?.identity||'')}"></label><label>العنوان<input name="address" value="${esc(c?.address||'')}"></label><label class="full">ملاحظات<textarea name="notes">${esc(c?.notes||'')}</textarea></label><div class="actions full"><button class="primary">حفظ الموكل</button><button type="button" class="secondary" id="cancelClient">إلغاء</button></div></form></section><section class="panel"><div class="panelhead"><h2>سجل الموكلين (${db.clients.length})</h2><input class="search" id="clientSearch" placeholder="ابحث بالاسم أو الهاتف"></div><div class="list" id="clientList">${clientItems()}</div></section>`}
function clientItems(q=''){let a=db.clients.filter(c=>(c.name+' '+c.phone+' '+c.identity).toLowerCase().includes(q.toLowerCase()));return a.length?a.map(c=>`<div class="item"><div><h3>${esc(c.name)}</h3><p>الهاتف: ${esc(c.phone||'—')} · الهوية: ${esc(c.identity||'—')}</p><p>العنوان: ${esc(c.address||'—')} · القضايا: ${db.cases.filter(k=>k.clientId===c.id).length}</p></div><div class="actions no-print"><button class="secondary" onclick="editC('${c.id}')">تعديل</button><button class="danger" onclick="delClient('${c.id}')">حذف</button></div></div>`).join(''):'<div class="empty">لا توجد بيانات.</div>'}
function casesPage(){let c=findCase(editCase);return `<section class="panel"><div class="panelhead"><h2>${c?'تعديل القضية':'تسجيل قضية جديدة'}</h2></div><form id="caseForm"><label>عنوان القضية<input name="title" required value="${esc(c?.title||'')}"></label><label>رقم القضية<input name="number" value="${esc(c?.number||'')}"></label><label>الموكل<select name="clientId" required><option value="">اختر الموكل</option>${db.clients.map(x=>`<option value="${x.id}" ${c?.clientId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>المحكمة<input name="court" value="${esc(c?.court||'')}"></label><label>نوع القضية<input name="kind" value="${esc(c?.kind||'')}"></label><label>الخصم<input name="opponent" value="${esc(c?.opponent||'')}"></label><label>مرحلة التقاضي<input name="stage" value="${esc(c?.stage||'')}"></label><label>الحالة<select name="status">${['منظورة','مؤجلة','محكوم فيها','منتهية','مؤرشفة'].map(s=>`<option ${c?.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="full">ملخص وموضوع القضية<textarea name="summary">${esc(c?.summary||'')}</textarea></label><div class="actions full"><button class="primary">حفظ القضية</button><button type="button" class="secondary" id="cancelCase">إلغاء</button></div></form></section><section class="panel"><div class="panelhead"><h2>القضايا (${db.cases.length})</h2><input class="search" id="caseSearch" placeholder="ابحث في القضايا"></div><div class="list" id="caseList">${caseItems()}</div></section>`}
function caseItems(q=''){let a=db.cases.filter(c=>(c.title+' '+c.number+' '+c.court+' '+c.opponent+' '+clientName(c.clientId)).toLowerCase().includes(q.toLowerCase()));return a.length?a.map(c=>`<div class="item"><div><h3>${esc(c.title)} <span class="badge">${esc(c.status||'منظورة')}</span></h3><p>رقم: ${esc(c.number||'—')} · الموكل: ${esc(clientName(c.clientId))}</p><p>المحكمة: ${esc(c.court||'—')} · الخصم: ${esc(c.opponent||'—')} · المرحلة: ${esc(c.stage||'—')}</p></div><div class="actions no-print"><button class="secondary" onclick="editK('${c.id}')">تعديل</button><button class="secondary" onclick="report('${c.id}')">تقرير</button><button class="secondary" onclick="archiveCase('${c.id}')">${c.status==='مؤرشفة'?'إلغاء الأرشفة':'أرشفة'}</button><button class="danger" onclick="delCase('${c.id}')">حذف</button></div></div>`).join(''):'<div class="empty">لا توجد قضايا.</div>'}
function hearingsPage(){return `<section class="panel"><div class="panelhead"><h2>إضافة جلسة أو موعد</h2></div><form id="hearingForm"><label>القضية<select name="caseId" required><option value="">اختر القضية</option>${db.cases.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select></label><label>عنوان الجلسة<input name="title" required placeholder="جلسة مرافعة أو نطق بالحكم"></label><label>التاريخ<input name="date" type="date" required></label><label>الوقت<input name="time" type="time"></label><label>المحكمة أو القاعة<input name="court"></label><label class="full">القرار أو الملاحظات<textarea name="notes"></textarea></label><div class="actions full"><button class="primary">حفظ الجلسة</button></div></form></section><section class="panel"><div class="panelhead"><h2>سجل الجلسات (${db.hearings.length})</h2></div><div class="list">${db.hearings.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(h=>`<div class="item"><div><h3>${esc(h.title)}</h3><p>${esc(caseName(h.caseId))}</p><p>${esc(h.date)} · ${esc(h.time||'—')} · ${esc(h.court||'')}</p><p>${esc(h.notes||'')}</p></div><button class="danger no-print" onclick="delHearing('${h.id}')">حذف</button></div>`).join('')||'<div class="empty">لا توجد جلسات.</div>'}</div></section>`}
function documentsPage(){return `<section class="panel"><div class="panelhead"><h2>إضافة مستند إلى ملف قضية</h2><span class="hint">سجّل بيانات المستند ومكان حفظ النسخة الورقية أو الإلكترونية</span></div><form id="documentForm"><label>القضية<select name="caseId"><option value="">مستند عام / غير مرتبط</option>${db.cases.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select></label><label>اسم المستند<input name="title" required placeholder="مثال: صورة الحكم الابتدائي"></label><label>نوع المستند<select name="kind"><option>حكم</option><option>عقد</option><option>وكالة</option><option>محضر</option><option>مذكرة</option><option>إيصال</option><option>مستند آخر</option></select></label><label>تاريخ المستند<input name="date" type="date"></label><label class="full">وصف المستند / مكان حفظه<textarea name="description" placeholder="رقم المستند، الجهة الصادرة، مكان حفظ الأصل..."></textarea></label><div class="actions full"><button class="primary">حفظ بيانات المستند</button></div></form></section><section class="panel"><div class="panelhead"><h2>فهرس المستندات (${db.documents.length})</h2><input id="docSearch" class="search" placeholder="ابحث في المستندات"></div><div class="list" id="docList">${documentItems()}</div></section>`}
function documentItems(q=''){let a=db.documents.filter(d=>(d.title+' '+d.kind+' '+d.description+' '+caseName(d.caseId)).toLowerCase().includes(q.toLowerCase()));return a.length?a.map(d=>`<div class="item"><div><h3>${esc(d.title)} <span class="badge">${esc(d.kind||'مستند')}</span></h3><p>${esc(caseName(d.caseId))} · التاريخ: ${esc(d.date||'—')}</p><p>${esc(d.description||'')}</p></div><button class="danger no-print" onclick="deleteRecord('documents','${d.id}')">حذف</button></div>`).join(''):'<div class="empty">لا توجد مستندات مفهرسة.</div>'}
function draftsPage(){let d=db.drafts.find(x=>x.id===editDraft);return `<section class="panel"><div class="panelhead"><h2>${d?'تعديل مذكرة محفوظة':'إنشاء مذكرة أو دفع قانوني'}</h2><span class="hint">مساحة تحرير وحفظ النصوص القانونية مع ربطها بالقضية</span></div><form id="draftForm"><label>عنوان المذكرة<input name="title" required value="${esc(d?.title||'')}"></label><label>نوع المستند<select name="kind">${['مذكرة دفاع','دفع شكلي','دفع موضوعي','عريضة دعوى','طلب قضائي','استئناف','تظلم','مذكرة ختامية','أخرى'].map(x=>`<option ${d?.kind===x?'selected':''}>${x}</option>`).join('')}</select></label><label>القضية المرتبطة<select name="caseId"><option value="">غير مرتبطة بقضية</option>${db.cases.map(c=>`<option value="${c.id}" ${d?.caseId===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select></label><label>تاريخ التحرير<input name="date" type="date" value="${esc(d?.date||dateToday())}"></label><label class="full">نص المذكرة<textarea name="body" required style="min-height:260px">${esc(d?.body||'')}</textarea></label><div class="actions full"><button class="primary">حفظ المذكرة</button><button type="button" class="secondary" id="cancelDraft">إلغاء</button></div></form></section><section class="panel"><div class="panelhead"><h2>المذكرات المحفوظة (${db.drafts.length})</h2><input id="draftSearch" class="search" placeholder="ابحث في المذكرات"></div><div class="list" id="draftList">${draftItems()}</div></section>`}
function draftItems(q=''){let a=db.drafts.filter(d=>(d.title+' '+d.kind+' '+d.body+' '+caseName(d.caseId)).toLowerCase().includes(q.toLowerCase()));return a.length?a.map(d=>`<div class="item"><div><h3>${esc(d.title)} <span class="badge">${esc(d.kind)}</span></h3><p>${esc(caseName(d.caseId))} · ${esc(d.date||'')}</p><p>${esc((d.body||'').slice(0,180))}${(d.body||'').length>180?'…':''}</p></div><div class="actions no-print"><button class="secondary" onclick="editD('${d.id}')">تعديل</button><button class="secondary" onclick="printDraft('${d.id}')">طباعة / PDF</button><button class="secondary" onclick="downloadDraft('${d.id}')">تنزيل TXT</button><button class="danger" onclick="deleteRecord('drafts','${d.id}')">حذف</button></div></div>`).join(''):'<div class="empty">لا توجد مذكرات محفوظة.</div>'}
function financePage(){let income=db.transactions.filter(t=>t.type==='قبض').reduce((s,t)=>s+Number(t.amount),0),out=db.transactions.filter(t=>t.type==='صرف').reduce((s,t)=>s+Number(t.amount),0);return `<section class="stats"><div class="stat"><small>إجمالي المقبوضات</small><strong class="money-in">${money(income)}</strong></div><div class="stat"><small>إجمالي المصروفات</small><strong class="money-out">${money(out)}</strong></div><div class="stat"><small>الرصيد الصافي</small><strong>${money(income-out)}</strong></div><div class="stat"><small>عدد الحركات</small><strong>${db.transactions.length}</strong></div></section><section class="panel"><div class="panelhead"><h2>تسجيل أتعاب أو مصروف أو دفعة</h2></div><form id="financeForm"><label>نوع الحركة<select name="type"><option>قبض</option><option>صرف</option></select></label><label>المبلغ<input name="amount" type="number" min="0.01" step="0.01" required></label><label>الموكل<select name="clientId"><option value="">غير مرتبط بموكل</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label>القضية<select name="caseId"><option value="">غير مرتبط بقضية</option>${db.cases.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select></label><label>التصنيف<input name="category" placeholder="أتعاب محاماة، رسوم، انتقالات..."></label><label>التاريخ<input name="date" type="date" value="${dateToday()}"></label><label class="full">البيان / طريقة الدفع<input name="description"></label><div class="actions full"><button class="primary">حفظ الحركة المالية</button></div></form></section><section class="panel"><div class="panelhead"><h2>سجل الحركات المالية</h2></div><div class="list">${db.transactions.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(t=>`<div class="item"><div><h3 class="${t.type==='قبض'?'money-in':'money-out'}">${t.type==='قبض'?'مقبوض':'مصروف'}: ${money(t.amount)}</h3><p>${esc(t.category||'—')} · ${esc(t.date||'')} · ${esc(clientName(t.clientId))}</p><p>${esc(caseName(t.caseId))} · ${esc(t.description||'')}</p></div><button class="danger no-print" onclick="deleteRecord('transactions','${t.id}')">حذف</button></div>`).join('')||'<div class="empty">لا توجد حركات مالية.</div>'}</div></section>`}
function backupPage(){return `<section class="panel"><h2>النسخ الاحتياطي واستعادة البيانات</h2><p class="hint">تشمل النسخة الاحتياطية الموكلين والقضايا والجلسات والمستندات والمذكرات والحركات المالية.</p><div class="actions no-print"><button class="primary" onclick="exportData()">تنزيل نسخة احتياطية JSON</button><label class="secondary" style="cursor:pointer">استعادة نسخة<input id="restoreFile" type="file" accept=".json,application/json" style="display:none"></label><button class="secondary" onclick="window.print()">طباعة الصفحة</button></div><div class="notice" style="margin-top:14px">قبل الاستعادة، نزّل نسخة احتياطية من بياناتك الحالية. الاستعادة تستبدل البيانات الموجودة. لا يوجد تشفير أو حساب مستخدم أو مزامنة سحابية في هذه النسخة.</div></section>`}
function bind(){let f=$('clientForm');if(f)f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f));if(editClient)Object.assign(findClient(editClient),x);else db.clients.push({id:uid(),...x});editClient=null;save();render()};f=$('caseForm');if(f)f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f));if(editCase)Object.assign(findCase(editCase),x);else db.cases.push({id:uid(),...x});editCase=null;save();render()};f=$('hearingForm');if(f)f.onsubmit=e=>{e.preventDefault();db.hearings.push({id:uid(),...Object.fromEntries(new FormData(f))});save();render()};f=$('documentForm');if(f)f.onsubmit=e=>{e.preventDefault();db.documents.push({id:uid(),...Object.fromEntries(new FormData(f))});save();render()};f=$('draftForm');if(f)f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f));if(editDraft)Object.assign(db.drafts.find(d=>d.id===editDraft),x);else db.drafts.push({id:uid(),...x});editDraft=null;save();render()};f=$('financeForm');if(f)f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f));x.amount=Number(x.amount);db.transactions.push({id:uid(),...x});save();render()};[['cancelClient',()=>{editClient=null;render()}],['cancelCase',()=>{editCase=null;render()}],['cancelDraft',()=>{editDraft=null;render()}]].forEach(([id,fn])=>{if($(id))$(id).onclick=fn});[['clientSearch','clientList',clientItems],['caseSearch','caseList',caseItems],['docSearch','docList',documentItems],['draftSearch','draftList',draftItems]].forEach(([a,b,fn])=>{if($(a))$(a).oninput=()=>$(b).innerHTML=fn($(a).value)});if($('restoreFile'))$('restoreFile').onchange=restoreData}
function editC(x){editClient=x;render()}function editK(x){editCase=x;render()}function editD(x){editDraft=x;render()}
function delClient(x){if(db.cases.some(c=>c.clientId===x)){alert('لا يمكن حذف موكل مرتبط بقضية.');return}if(confirm('حذف الموكل؟')){db.clients=db.clients.filter(c=>c.id!==x);save();render()}}
function delCase(x){if(confirm('حذف القضية سيحذف جلساتها المرتبطة. هل تتابع؟')){db.cases=db.cases.filter(c=>c.id!==x);db.hearings=db.hearings.filter(h=>h.caseId!==x);save();render()}}
function archiveCase(x){let c=findCase(x);c.status=c.status==='مؤرشفة'?'منظورة':'مؤرشفة';save();render()}
function delHearing(x){if(confirm('حذف الجلسة؟')){db.hearings=db.hearings.filter(h=>h.id!==x);save();render()}}
function deleteRecord(k,x){if(confirm('هل تريد حذف السجل؟')){db[k]=db[k].filter(a=>a.id!==x);save();render()}}
function report(x){let c=findCase(x),hs=db.hearings.filter(h=>h.caseId===x);let w=window.open('','_blank');if(!w){alert('اسمح بالنوافذ المنبثقة للطباعة');return}w.document.write(`<html lang="ar" dir="rtl"><meta charset="utf-8"><title>تقرير قضية</title><style>body{font-family:Tahoma;padding:30px;line-height:1.8}h1,h2{color:#17344d}</style><h1>المكتبة القانونية</h1><h2>تقرير القضية</h2><p>عنوان القضية: ${esc(c.title)}</p><p>رقمها: ${esc(c.number||'—')}</p><p>الموكل: ${esc(clientName(c.clientId))}</p><p>المحكمة: ${esc(c.court||'—')}</p><p>الخصم: ${esc(c.opponent||'—')}</p><p>المرحلة: ${esc(c.stage||'—')}</p><p>الحالة: ${esc(c.status||'—')}</p><h3>ملخص القضية</h3><p>${esc(c.summary||'—')}</p><h3>الجلسات</h3>${hs.map(h=>`<p>${esc(h.date)} - ${esc(h.title)} - ${esc(h.notes||'')}</p>`).join('')}<script>window.onload=()=>window.print()<\\/script></html>`);w.document.close()}
function printDraft(x){let d=db.drafts.find(a=>a.id===x),w=window.open('','_blank');if(!w){alert('اسمح بالنوافذ المنبثقة للطباعة');return}w.document.write(`<html lang="ar" dir="rtl"><meta charset="utf-8"><title>${esc(d.title)}</title><style>body{font-family:Tahoma,Arial;padding:35px;line-height:2;white-space:pre-wrap}h2{text-align:center}</style><h2>${esc(d.title)}</h2><p>نوع المستند: ${esc(d.kind)} | التاريخ: ${esc(d.date||'')}</p><hr><div>${esc(d.body).replace(/\n/g,'<br>')}</div><script>window.onload=()=>window.print()<\\/script></html>`);w.document.close()}
function downloadDraft(x){let d=db.drafts.find(a=>a.id===x),blob=new Blob([d.title+'\n'+d.body],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(d.title||'مذكرة')+'.txt';a.click();URL.revokeObjectURL(a.href)}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='نسخة-المكتبة-القانونية-'+dateToday()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreData(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Array.isArray(d.clients)||!Array.isArray(d.cases)||!Array.isArray(d.hearings))throw Error();for(let k of ['documents','drafts','transactions'])if(!Array.isArray(d[k]))d[k]=[];if(confirm('سيتم استبدال البيانات الحالية. هل أنشأت نسخة احتياطية وتريد المتابعة؟')){db=d;save();render();alert('تمت الاستعادة')}}catch(e){alert('الملف غير صالح أو غير مكتمل')}};reader.readAsText(file)}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script></body></html>
