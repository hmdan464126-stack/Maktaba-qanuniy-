<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10243a"><meta name="description" content="المكتبة القانونية - إدارة الموكلين والقضايا والجلسات والمستندات">
<link rel="manifest" href="manifest.webmanifest">
<title>المكتبة القانونية</title>
<style>
:root{--navy:#10243a;--navy2:#193752;--gold:#c6a45b;--bg:#f3f5f8;--ink:#172536;--muted:#6b7785;--line:#e2e7ed;--white:#fff;--red:#b63c3c;--green:#26734d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;padding:22px 18px 18px;border-bottom:4px solid var(--gold)}
.top{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border:1px solid #d8bd7b;border-radius:14px;display:grid;place-items:center;font-size:25px;color:#e5ca87}.brand h1{font-size:20px;margin:0 0 5px}.brand p{margin:0;color:#d5deea;font-size:12px}
main{max-width:1100px;margin:20px auto;padding:0 14px 90px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat,.panel,.card{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 12px #14283a0a}.stat{padding:14px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:7px;color:var(--navy)}
.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 13px}.tab{border:1px solid var(--line);background:white;color:var(--navy);padding:10px 14px;border-radius:10px;white-space:nowrap;font-weight:bold}.tab.active{background:var(--navy);color:white;border-color:var(--navy)}
.panel{padding:16px;margin-bottom:15px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.panel h2{font-size:17px;margin:0;color:var(--navy)}.hint{font-size:12px;color:var(--muted)}
button{cursor:pointer;font-family:inherit}.primary{background:var(--gold);color:#1c2632;border:0;border-radius:9px;padding:10px 14px;font-weight:bold}.secondary{background:#edf1f5;color:var(--navy);border:1px solid var(--line);border-radius:9px;padding:9px 12px}.danger{color:var(--red);background:#fff0f0;border:1px solid #f1d0d0;border-radius:8px;padding:7px 10px}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}label{display:block;font-size:13px;font-weight:bold;color:#39495a}input,select,textarea{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #d7dee6;border-radius:9px;background:#fff;font:14px Tahoma,Arial;color:var(--ink);outline-color:var(--gold)}textarea{min-height:78px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:11px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item h3{font-size:15px;margin:0 0 6px;color:var(--navy)}.item p{font-size:12px;color:var(--muted);margin:4px 0;line-height:1.6}.badge{display:inline-block;background:#f5f0e3;color:#755b23;padding:4px 8px;border-radius:20px;font-size:11px}.empty{text-align:center;padding:26px;color:var(--muted);border:1px dashed #ccd5df;border-radius:10px}.search{max-width:260px}
.bottomnote{text-align:center;color:#8b96a3;font-size:11px;margin-top:24px}
@media(max-width:600px){.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:21px}.stat small{font-size:11px}form{grid-template-columns:1fr}.full{grid-column:auto}.panelhead{align-items:flex-start;flex-direction:column}.item{flex-direction:column}.search{max-width:none;width:100%}}
@media print{header,.tabs,.no-print,button{display:none!important}body{background:white}.panel,.stat,.item{box-shadow:none;break-inside:avoid}main{max-width:none;margin:0;padding:0}.panel{border:0}}
</style></head>
<body>
<header><div class="top"><div class="brand"><div class="logo">⚖</div><div><h1>المكتبة القانونية</h1><p>نظام مبسط لإدارة العمل القانوني والقضايا</p></div></div><span style="font-size:12px;color:#e6d4a6">الإصدار 1.0</span></div></header>
<main>
<section class="stats">
 <div class="stat"><small>إجمالي الموكلين</small><strong id="clientCount">0</strong></div>
 <div class="stat"><small>القضايا المسجلة</small><strong id="caseCount">0</strong></div>
 <div class="stat"><small>الجلسات القادمة</small><strong id="hearingCount">0</strong></div>
</section>
<nav class="tabs no-print">
 <button class="tab active" data-view="home">الرئيسية</button><button class="tab" data-view="clients">الموكلون</button><button class="tab" data-view="cases">القضايا</button><button class="tab" data-view="hearings">الجلسات</button><button class="tab" data-view="backup">النسخ الاحتياطي</button>
</nav>
<div id="view"></div>
<p class="bottomnote">تُحفظ البيانات على هذا الجهاز والمتصفح فقط. احتفظ بنسخة احتياطية دورية.</p>
</main>
<script>
const KEY='maktaba_qanuniya_v1';
let db=load(), view='home', editClient=null, editCase=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{clients:[],cases:[],hearings:[]}}catch(e){return {clients:[],cases:[],hearings:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderStats()}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderStats(){document.getElementById('clientCount').textContent=db.clients.length;document.getElementById('caseCount').textContent=db.cases.length;let today=new Date().toISOString().slice(0,10);document.getElementById('hearingCount').textContent=db.hearings.filter(x=>x.date>=today).length}
function setView(v){view=v;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
function render(){renderStats();let root=document.getElementById('view');if(view==='home')root.innerHTML=home();if(view==='clients')root.innerHTML=clientsPage();if(view==='cases')root.innerHTML=casesPage();if(view==='hearings')root.innerHTML=hearingsPage();if(view==='backup')root.innerHTML=backupPage();bind()}
function home(){let next=db.hearings.filter(h=>h.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
return `<section class="panel"><div class="panelhead"><h2>مرحباً بك في المكتبة القانونية</h2><span class="badge">لوحة التحكم</span></div><p class="hint">من هنا يمكنك تنظيم بيانات الموكلين والقضايا ومواعيد الجلسات وحفظ المستندات.</p><div class="actions no-print"><button class="primary" onclick="setView('clients')">إضافة موكل</button><button class="secondary" onclick="setView('cases')">تسجيل قضية</button><button class="secondary" onclick="setView('hearings')">إضافة جلسة</button></div></section>
<section class="panel"><div class="panelhead"><h2>أقرب الجلسات</h2><button class="secondary no-print" onclick="setView('hearings')">عرض الكل</button></div>${next.length?`<div class="list">${next.map(h=>`<div class="item"><div><h3>${esc(h.title)}</h3><p>التاريخ: ${esc(h.date)} · ${esc(h.court||'')}</p><p>${esc(caseName(h.caseId))}</p></div><span class="badge">${esc(h.time||'موعد غير محدد')}</span></div>`).join('')}</div>`:'<div class="empty">لا توجد جلسات قادمة مسجلة.</div>'}</section>`}
function clientsPage(){return `<section class="panel"><div class="panelhead"><h2>${editClient?'تعديل بيانات موكل':'إضافة موكل جديد'}</h2><span class="hint">احفظ الاسم ووسائل التواصل والبيانات الأساسية</span></div><form id="clientForm"><label>اسم الموكل<input name="name" required value="${esc(findClient(editClient)?.name||'')}"></label><label>رقم الهاتف<input name="phone" value="${esc(findClient(editClient)?.phone||'')}" inputmode="tel"></label><label>رقم الهوية<input name="identity" value="${esc(findClient(editClient)?.identity||'')}"></label><label>العنوان<input name="address" value="${esc(findClient(editClient)?.address||'')}"></label><label class="full">ملاحظات<textarea name="notes">${esc(findClient(editClient)?.notes||'')}</textarea></label><div class="actions full"><button class="primary">حفظ الموكل</button><button type="button" class="secondary" id="cancelClient">إلغاء</button></div></form></section>
<section class="panel"><div class="panelhead"><h2>سجل الموكلين (${db.clients.length})</h2><input class="search" id="clientSearch" placeholder="ابحث باسم الموكل أو الهاتف"></div><div class="list" id="clientList">${clientItems()}</div></section>`}
function findClient(x){return db.clients.find(c=>c.id===x)}
function clientItems(q=''){let arr=db.clients.filter(c=>(c.name+' '+c.phone).includes(q));return arr.length?arr.map(c=>`<div class="item"><div><h3>${esc(c.name)}</h3><p>الهاتف: ${esc(c.phone||'—')} · الهوية: ${esc(c.identity||'—')}</p><p>العنوان: ${esc(c.address||'—')}</p></div><div class="actions no-print"><button class="secondary" onclick="editC('${c.id}')">تعديل</button><button class="danger" onclick="delClient('${c.id}')">حذف</button></div></div>`).join(''):'<div class="empty">لا توجد بيانات مطابقة.</div>'}
function casesPage(){let c=findCase(editCase);return `<section class="panel"><div class="panelhead"><h2>${c?'تعديل بيانات القضية':'تسجيل قضية جديدة'}</h2><span class="hint">اربط القضية بموكل مسجل</span></div><form id="caseForm"><label>عنوان القضية<input name="title" required value="${esc(c?.title||'')}"></label><label>رقم القضية<input name="number" value="${esc(c?.number||'')}"></label><label>الموكل<select name="clientId" required><option value="">اختر الموكل</option>${db.clients.map(x=>`<option value="${x.id}" ${c?.clientId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>المحكمة<input name="court" value="${esc(c?.court||'')}"></label><label>نوع القضية<input name="kind" value="${esc(c?.kind||'')}"></label><label>الحالة<select name="status"><option ${c?.status==='منظورة'?'selected':''}>منظورة</option><option ${c?.status==='مؤجلة'?'selected':''}>مؤجلة</option><option ${c?.status==='محكوم فيها'?'selected':''}>محكوم فيها</option><option ${c?.status==='منتهية'?'selected':''}>منتهية</option><option ${c?.status==='مؤرشفة'?'selected':''}>مؤرشفة</option></select></label><label class="full">ملخص وموضوع القضية<textarea name="summary">${esc(c?.summary||'')}</textarea></label><div class="actions full"><button class="primary">حفظ القضية</button><button type="button" class="secondary" id="cancelCase">إلغاء</button></div></form></section>
<section class="panel"><div class="panelhead"><h2>القضايا (${db.cases.length})</h2><input class="search" id="caseSearch" placeholder="ابحث في القضايا"></div><div class="list" id="caseList">${caseItems()}</div></section>`}
function findCase(x){return db.cases.find(c=>c.id===x)}
function clientName(x){return db.clients.find(c=>c.id===x)?.name||'موكل محذوف'}
function caseName(x){return db.cases.find(c=>c.id===x)?.title||'قضية غير محددة'}
function caseItems(q=''){let a=db.cases.filter(c=>(c.title+' '+c.number+' '+c.court+' '+clientName(c.clientId)).toLowerCase().includes(q.toLowerCase()));return a.length?a.map(c=>`<div class="item"><div><h3>${esc(c.title)} <span class="badge">${esc(c.status||'منظورة')}</span></h3><p>رقم: ${esc(c.number||'—')} · الموكل: ${esc(clientName(c.clientId))}</p><p>المحكمة: ${esc(c.court||'—')} · النوع: ${esc(c.kind||'—')}</p></div><div class="actions no-print"><button class="secondary" onclick="editK('${c.id}')">تعديل</button><button class="secondary" onclick="report('${c.id}')">تقرير</button><button class="secondary" onclick="archiveCase('${c.id}')">${c.status==='مؤرشفة'?'إلغاء الأرشفة':'أرشفة'}</button><button class="danger" onclick="delCase('${c.id}')">حذف</button></div></div>`).join(''):'<div class="empty">لا توجد قضايا مسجلة.</div>'}
function hearingsPage(){return `<section class="panel"><div class="panelhead"><h2>إضافة جلسة أو موعد</h2></div><form id="hearingForm"><label>القضية<select name="caseId" required><option value="">اختر القضية</option>${db.cases.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select></label><label>عنوان الجلسة<input name="title" required placeholder="مثال: جلسة مرافعة"></label><label>التاريخ<input name="date" type="date" required></label><label>الوقت<input name="time" type="time"></label><label>المحكمة أو القاعة<input name="court"></label><label class="full">ملاحظات<textarea name="notes"></textarea></label><div class="actions full"><button class="primary">حفظ الموعد</button></div></form></section><section class="panel"><div class="panelhead"><h2>سجل الجلسات (${db.hearings.length})</h2></div><div class="list">${db.hearings.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(h=>`<div class="item"><div><h3>${esc(h.title)}</h3><p>${esc(caseName(h.caseId))}</p><p>التاريخ: ${esc(h.date)} · الوقت: ${esc(h.time||'—')} · ${esc(h.court||'')}</p><p>${esc(h.notes||'')}</p></div><button class="danger no-print" onclick="delHearing('${h.id}')">حذف</button></div>`).join('')||'<div class="empty">لا توجد جلسات.</div>'}</div></section>`}
function backupPage(){return `<section class="panel"><h2>النسخ الاحتياطي واستعادة البيانات</h2><p class="hint">صدّر نسخة JSON للاحتفاظ بها، ويمكن استعادتها لاحقاً من هذا الجهاز أو جهاز آخر.</p><div class="actions no-print"><button class="primary" onclick="exportData()">تنزيل نسخة احتياطية</button><label class="secondary" style="cursor:pointer">استعادة نسخة<input id="restoreFile" type="file" accept=".json,application/json" style="display:none"></label><button class="danger" onclick="clearAll()">مسح جميع البيانات</button></div><p class="hint">تنبيه: لا تحفظ كلمات مرور أو بيانات شديدة الحساسية هنا. التطبيق لا يرسل بياناتك إلى خادم.</p></section>`}
function bind(){let f=document.getElementById('clientForm');if(f)f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));if(editClient)Object.assign(findClient(editClient),d);else db.clients.push({id:id(),...d});editClient=null;save();render()};let cf=document.getElementById('caseForm');if(cf)cf.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(cf));if(editCase)Object.assign(findCase(editCase),d);else db.cases.push({id:id(),...d});editCase=null;save();render()};let hf=document.getElementById('hearingForm');if(hf)hf.onsubmit=e=>{e.preventDefault();db.hearings.push({id:id(),...Object.fromEntries(new FormData(hf))});save();render()};let cc=document.getElementById('cancelClient');if(cc)cc.onclick=()=>{editClient=null;render()};let ck=document.getElementById('cancelCase');if(ck)ck.onclick=()=>{editCase=null;render()};let cs=document.getElementById('clientSearch');if(cs)cs.oninput=()=>document.getElementById('clientList').innerHTML=clientItems(cs.value);let ks=document.getElementById('caseSearch');if(ks)ks.oninput=()=>document.getElementById('caseList').innerHTML=caseItems(ks.value);let rf=document.getElementById('restoreFile');if(rf)rf.onchange=restoreData}
function editC(x){editClient=x;render()}function editK(x){editCase=x;render()}
function delClient(x){if(db.cases.some(c=>c.clientId===x)){alert('لا يمكن حذف الموكل لوجود قضايا مرتبطة به.');return}if(confirm('هل تريد حذف الموكل؟')){db.clients=db.clients.filter(c=>c.id!==x);save();render()}}
function delCase(x){if(confirm('حذف القضية سيحذف جلساتها أيضاً. هل أنت متأكد؟')){db.cases=db.cases.filter(c=>c.id!==x);db.hearings=db.hearings.filter(h=>h.caseId!==x);save();render()}}
function archiveCase(x){let c=findCase(x);c.status=c.status==='مؤرشفة'?'منظورة':'مؤرشفة';save();render()}
function delHearing(x){if(confirm('حذف الجلسة؟')){db.hearings=db.hearings.filter(h=>h.id!==x);save();render()}}
function report(x){let c=findCase(x),hs=db.hearings.filter(h=>h.caseId===x).sort((a,b)=>a.date.localeCompare(b.date));let w=window.open('','_blank');if(!w){alert('اسمح بالنوافذ المنبثقة لطباعة التقرير');return}w.document.write(`<html lang="ar" dir="rtl"><meta charset="utf-8"><title>تقرير قضية</title><style>body{font-family:Tahoma,Arial;padding:30px;line-height:1.8}h1,h2{color:#17344d}table{width:100%;border-collapse:collapse}td,th{border:1px solid #bbb;padding:8px;text-align:right}</style><h1>المكتبة القانونية</h1><h2>تقرير بيانات القضية</h2><p><b>القضية:</b> ${esc(c.title)}</p><p><b>رقم القضية:</b> ${esc(c.number||'—')}</p><p><b>الموكل:</b> ${esc(clientName(c.clientId))}</p><p><b>المحكمة:</b> ${esc(c.court||'—')}</p><p><b>الحالة:</b> ${esc(c.status||'—')}</p><h3>ملخص القضية</h3><p>${esc(c.summary||'لا يوجد')}</p><h3>الجلسات</h3><table><tr><th>الجلسة</th><th>التاريخ</th><th>الوقت</th><th>ملاحظات</th></tr>${hs.map(h=>`<tr><td>${esc(h.title)}</td><td>${esc(h.date)}</td><td>${esc(h.time||'—')}</td><td>${esc(h.notes||'—')}</td></tr>`).join('')}</table><p style="margin-top:40px">تاريخ إعداد التقرير: ${new Date().toLocaleDateString('ar')}</p><script>window.onload=()=>window.print()<\/script></html>`);w.document.close()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='نسخة-المكتبة-القانونية-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.clients)||!Array.isArray(d.cases)||!Array.isArray(d.hearings))throw 0;if(confirm('سيتم استبدال البيانات الحالية. هل تتابع؟')){db=d;save();render();alert('تمت استعادة البيانات')}}catch(_){alert('ملف النسخة الاحتياطية غير صالح')}};r.readAsText(file)}
function clearAll(){if(confirm('تحذير: سيتم حذف كل البيانات نهائياً من هذا المتصفح. هل أنت متأكد؟')){db={clients:[],cases:[],hearings:[]};save();render()}}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script></body></html>
